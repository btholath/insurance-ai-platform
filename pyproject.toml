[project]
name = "insurance-ai-platform"
version = "0.1.0"
description = "Phase 1 Foundation — Platform Skeleton & Role-Based Access"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.0,<6.0",
    "django-environ>=0.11,<1.0",
    "gunicorn>=22.0,<23.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<4.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "--reuse-db --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
